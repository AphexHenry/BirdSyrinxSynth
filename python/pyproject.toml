[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "cuicui"
version = "0.1.0"
description = "Syrinx analysis, listening kit, and (later) fitting tools"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "matplotlib",
    "jsonschema",
    "pytest",
    "ruff",
    "nanobind",
]

[tool.uv]
# The C++ module is built by CMake (`scripts/build.sh`) into python/cuicui_core*.so.
# `uv pip install -e .` uses scikit-build-core when you want a wheel install.
package = false

[tool.scikit-build]
wheel.packages = ["cuicui"]
cmake.source-dir = "."
build-dir = "../build/python"
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"cuicui/listen/spectrogram.py" = ["E402"]
"cuicui/analysis/bifurcation.py" = ["E402"]
"cuicui/analysis/trachea_response.py" = ["E402"]
"cuicui/analysis/uvt_response.py" = ["E402"]
"cuicui/analysis/locking.py" = ["E402"]
